[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulmonarytreegraph"
version = "0.1.0"
description = "Pulmonary vascular graph modeling for embolism analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Morgane", email = "morgane.des-ligneris@creatis.insa-lyon.fr"}
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24,<2.3",
    "scipy>=1.15",
    "networkx>=3.5",
    "scikit-image>=0.25",
    "nibabel>=5.3",
    "numba>=0.59.0",
    "skan>=0.12.0",
    "matplotlib>=3.5.0",
    "pandas>=1.5.0",
    "seaborn>=0.11.0",
    "pre-commit>=4.2.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # Pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
]

ignore = [
    "E501",    # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["pulmonarytreegraph"]
